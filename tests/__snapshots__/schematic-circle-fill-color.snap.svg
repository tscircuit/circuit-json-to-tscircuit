<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" style="background-color: rgb(245, 241, 237)" data-real-to-screen-transform="matrix(133.3333333333,0,0,-133.3333333333,600,300)" data-software-used-string="@tscircuit/core@0.0.1322"><style>
              .boundary { fill: rgb(245, 241, 237); }
              .schematic-boundary { fill: none; stroke: #fff; }
              .component { fill: none; stroke: rgb(132, 0, 0); }
              .chip { fill: rgb(255, 255, 194); stroke: rgb(132, 0, 0); }
              .component-pin { fill: none; stroke: rgb(132, 0, 0); }
              /* Basic per-trace hover fallback */
              .trace:hover {
                filter: invert(1);
              }
              .trace:hover .trace-crossing-outline {
                opacity: 0;
              }
              .trace:hover .trace-junction {
                filter: invert(1);
              }
              /* Net-hover highlighting: when a trace or its overlays are hovered,
                 invert color for all traces (base + overlays) sharing the same
                 subcircuit connectivity key. Also hide crossing outline during hover. */

              .text { font-family: sans-serif; fill: rgb(0, 150, 0); }
              .pin-number { fill: rgb(169, 0, 0); }
              .port-label { fill: rgb(0, 100, 100); }
              .component-name { fill: rgb(0, 100, 100); }
            </style><rect class="boundary" x="0" y="0" width="1200" height="600"/><g data-circuit-json-type="schematic_component" data-schematic-component-id="schematic_component_0"><circle cx="200.0000000001" cy="300" r="133.3333333333" fill="#ffffff" stroke="#0000ff" stroke-width="26.666666666660003" data-schematic-circle-id="schematic_circle_0" data-schematic-component-id="schematic_component_0"/><circle cx="600" cy="300" r="133.3333333333" fill="#ff0000" stroke="#0000ff" stroke-width="26.666666666660003" data-schematic-circle-id="schematic_circle_1" data-schematic-component-id="schematic_component_0"/><circle cx="999.9999999999" cy="300" r="133.3333333333" fill="#0000ff" stroke="#0000ff" stroke-width="26.666666666660003" data-schematic-circle-id="schematic_circle_2" data-schematic-component-id="schematic_component_0"/></g></svg>