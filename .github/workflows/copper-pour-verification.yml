name: Copper pour clearance verification
on:
  push:
    branches: [codex/pour-clearance-verification]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Prepare repro and fix
        run: |
          node <<'NODE'
          const fs=require('node:fs');const path=require('node:path');const files={"tests/fixtures/copper-pour-clearance.ts":"import type { CircuitJson, Point } from \"circuit-json\"\nimport { runTscircuitCode } from \"tscircuit\"\n\nexport async function createCopperPourClearanceCircuit(): Promise<CircuitJson> {\n  const rendered = await runTscircuitCode(`\n    const footprint = <footprint>\n      <smtpad shape=\"rect\" width={0.6} height={0.6} pcbX={0} pcbY={0} portHints={[\"1\"]} />\n    </footprint>\n    export default () => <board width={12} height={8}>\n      <net name=\"GND\" />\n      <net name=\"SIGNAL\" />\n      <chip name=\"A\" footprint={footprint} pcbX={-3} pcbY={0} connections={{pin1: \"net.SIGNAL\"}} />\n      <chip name=\"B\" footprint={footprint} pcbX={3} pcbY={0} connections={{pin1: \"net.SIGNAL\"}} />\n      <chip name=\"G\" footprint={footprint} pcbX={-3} pcbY={-2} connections={{pin1: \"net.GND\"}} />\n    </board>\n  `)\n  const ground = rendered.find(\n    (element) => element.type === \"source_net\" && element.name === \"GND\",\n  )\n  if (ground?.type !== \"source_net\") throw new Error(\"Expected the fixture GND net\")\n\n  const circuitJson = rendered\n    .filter((element) => element.type !== \"pcb_trace\" && element.type !== \"pcb_via\")\n    .map((element) =>\n      element.type === \"pcb_board\"\n        ? {\n            ...element,\n            min_trace_to_pad_edge_clearance: 0.3,\n            min_different_net_trace_edge_to_trace_edge_clearance: 0.3,\n            min_pad_edge_to_pad_edge_clearance: 0.3,\n            min_board_edge_clearance: 0.4,\n          }\n        : element,\n    )\n  return [\n    ...circuitJson,\n    {\n      type: \"pcb_copper_pour\",\n      pcb_copper_pour_id: \"pcb_copper_pour_definition\",\n      source_net_id: ground.source_net_id,\n      layer: \"top\",\n      covered_with_solder_mask: false,\n      shape: \"polygon\",\n      points: [\n        { x: -5, y: -3 },\n        { x: 5, y: -3 },\n        { x: 5, y: 3 },\n        { x: -5, y: 3 },\n      ],\n    },\n  ]\n}\n\nexport function hasCopperPourAt(circuitJson: CircuitJson, point: Point): boolean {\n  return circuitJson.some(\n    (element) =>\n      element.type === \"pcb_copper_pour\" &&\n      element.shape === \"brep\" &&\n      isPointInsideRing(element.brep_shape.outer_ring.vertices, point) &&\n      !element.brep_shape.inner_rings.some((ring) =>\n        isPointInsideRing(ring.vertices, point),\n      ),\n  )\n}\n\nfunction isPointInsideRing(vertices: Point[], point: Point): boolean {\n  let inside = false\n  for (let i = 0, j = vertices.length - 1; i < vertices.length; j = i++) {\n    const a = vertices[i]!\n    const b = vertices[j]!\n    if (\n      a.y > point.y !== b.y > point.y &&\n      point.x < ((b.x - a.x) * (point.y - a.y)) / (b.y - a.y) + a.x\n    ) {\n      inside = !inside\n    }\n  }\n  return inside\n}\n","tests/test29-copper-pour-clearance-repro.test.tsx":"import { expect, test } from \"bun:test\"\nimport { convertCircuitJsonToPcbSvg } from \"circuit-to-svg\"\nimport { convertCircuitJsonToTscircuit } from \"lib\"\nimport { stackSvgsHorizontally } from \"stack-svgs\"\nimport { runTscircuitCode } from \"tscircuit\"\nimport {\n  createCopperPourClearanceCircuit,\n  hasCopperPourAt,\n} from \"./fixtures/copper-pour-clearance\"\n\ntest(\"shows zero-clearance copper around a newly routed trace\", async () => {\n  const input = await createCopperPourClearanceCircuit()\n  const tsx = convertCircuitJsonToTscircuit(input, {\n    componentName: \"ClearanceBoard\",\n  })\n  const rendered = await runTscircuitCode(tsx)\n  expect(tsx).toContain(\"traceMargin={0}\")\n  expect(rendered.some((element) => element.type === \"pcb_trace\")).toBe(true)\n  expect(hasCopperPourAt(rendered, { x: 0, y: 0.2 })).toBe(true)\n\n  const comparison = stackSvgsHorizontally(\n    [input, rendered].map((circuitJson) =>\n      convertCircuitJsonToPcbSvg(circuitJson, {\n        width: 600,\n        height: 400,\n        backgroundColor: \"white\",\n        includeVersion: false,\n        showSolderMask: false,\n        shouldDrawRatsNest: false,\n      }),\n    ),\n    {\n      gap: 24,\n      normalizeSize: false,\n      rootAttributes: {\n        \"aria-label\": \"Unrouted pour definition on left; core output with zero clearance on right\",\n      },\n    },\n  )\n  await expect(comparison).toMatchSvgSnapshot(import.meta.path)\n}, 30000)\n","lib/index.ts":"import type { CircuitJson } from \"circuit-json\"\nimport { getBoardUsingTemplate, type BoardTemplateParams } from \"./get-board-using-template\"\nimport {\n  getComponentUsingTemplate,\n  type ComponentTemplateParams,\n} from \"./get-component-using-template\"\nimport { getSchematicUsingTemplate } from \"./get-schematic-using-template\"\n\nexport const convertCircuitJsonToTscircuit = (\n  circuitJson: CircuitJson,\n  opts: Omit<ComponentTemplateParams, \"circuitJson\"> & Pick<BoardTemplateParams, \"copperPourMode\">,\n) => {\n  // A pcb_board is only present when the circuit json was authored as a\n  // board, so it routes to the board converter. A footprint/component import\n  // (the chip use case) has no pcb_board and falls through to the chip path.\n  const hasBoard = circuitJson.some((el) => el.type === \"pcb_board\")\n\n  if (hasBoard) {\n    return getBoardUsingTemplate({\n      circuitJson,\n      componentName: opts.componentName,\n      copperPourMode: opts.copperPourMode,\n    })\n  }\n\n  const hasSchematicSheet = circuitJson.some(\n    (element) => element.type === \"schematic_sheet\",\n  )\n  if (hasSchematicSheet) {\n    return getSchematicUsingTemplate({\n      circuitJson,\n      componentName: opts.componentName,\n    })\n  }\n\n  return getComponentUsingTemplate({\n    circuitJson,\n    ...opts,\n  })\n}\n","lib/get-board-using-template.ts":"import type { AnyCircuitElement } from \"circuit-json\"\nimport { convertBoardCircuitJson } from \"./board-converter/convert-board-circuit-json\"\n\nexport interface BoardTemplateParams {\n  circuitJson: AnyCircuitElement[]\n  componentName?: string\n  /** Preserve imported artwork by default; recompute uses explicit board clearances. */\n  copperPourMode?: \"preserve\" | \"recompute\"\n}\n\nexport const getBoardUsingTemplate = ({\n  circuitJson,\n  componentName,\n  copperPourMode,\n}: BoardTemplateParams) =>\n  convertBoardCircuitJson({ circuitJson, componentName, copperPourMode })\n","lib/board-converter/convert-board-circuit-json.ts":"import type { AnyCircuitElement } from \"circuit-json\"\nimport type {\n  BoardConverterContext,\n  BoardConverterStage,\n} from \"./BoardConverterContext\"\nimport { createComponentPreservingBoardConversionContext } from \"./create-component-preserving-board-conversion-context\"\nimport { getBoardChildRuntimeNames } from \"./get-board-child-runtime-names\"\nimport { convertBoardCadModels } from \"./stages/convert-board-cad-models\"\nimport { convertBoardNets } from \"./stages/convert-board-nets\"\nimport { convertBoardProperties } from \"./stages/convert-board-properties\"\nimport { convertBoardSchematic } from \"./stages/convert-board-schematic\"\nimport { convertBoardTraces } from \"./stages/convert-board-traces\"\nimport { convertCopperPours } from \"./stages/convert-copper-pours\"\nimport { convertPcbComponents } from \"./stages/convert-pcb-components\"\nimport { convertStandalonePcbPrimitives } from \"./stages/convert-standalone-pcb-primitives\"\n\nconst conversionStages: BoardConverterStage[] = [\n  convertBoardProperties,\n  convertPcbComponents,\n  convertBoardNets,\n  convertBoardTraces,\n  convertCopperPours,\n  convertBoardSchematic,\n  convertStandalonePcbPrimitives,\n  convertBoardCadModels,\n]\n\nexport const convertBoardCircuitJson = ({\n  circuitJson,\n  componentName,\n  copperPourMode,\n}: {\n  circuitJson: AnyCircuitElement[]\n  componentName?: string\n  copperPourMode?: BoardConverterContext[\"copperPourMode\"]\n}): string => {\n  const pcbBoard = circuitJson.find((element) => element.type === \"pcb_board\")\n\n  if (!pcbBoard) {\n    throw new Error(\"Board conversion requires a pcb_board element\")\n  }\n\n  const {\n    pcbChipName,\n    pcbComponentRuntimeNameByPcbComponentId,\n    standaloneCadModelRuntimeNameByCadComponentId,\n  } = getBoardChildRuntimeNames(circuitJson)\n\n  const context: BoardConverterContext = {\n    circuitJson,\n    copperPourMode,\n    footprintConversionContext: createComponentPreservingBoardConversionContext(\n      {\n        circuitJson,\n        pcbChipName,\n        pcbComponentRuntimeNameByPcbComponentId,\n      },\n    ),\n    pcbComponentRuntimeNameByPcbComponentId,\n    standaloneCadModelRuntimeNameByCadComponentId,\n    pcbBoard,\n    boardProps: [],\n    boardChildren: [],\n  }\n\n  for (const convertStage of conversionStages) {\n    convertStage(context)\n  }\n\n  const boardProps = context.boardProps.join(\" \")\n  const boardChildren = context.boardChildren.join(\"\\n\")\n\n  return `\n${componentName ? `export const ${componentName} =` : \"export default\"} () => (\n  <board${boardProps ? ` ${boardProps}` : \"\"}>\n    ${boardChildren.replace(/\\n/g, \"\\n    \")}\n  </board>\n)\n${componentName ? `export default ${componentName}` : \"\"}\n`\n    .replace(/\\n\\s*\\n/g, \"\\n\")\n    .trim()\n}\n","lib/board-converter/BoardConverterContext.ts":"import type { AnyCircuitElement, PcbBoard } from \"circuit-json\"\nimport type { BoardConversionContext as FootprintConversionContext } from \"../board-conversion-context\"\nimport type {\n  PcbComponentRuntimeNameByPcbComponentId,\n  StandaloneCadModelRuntimeNameByCadComponentId,\n} from \"./get-board-child-runtime-names\"\n\nexport interface BoardConverterContext {\n  circuitJson: AnyCircuitElement[]\n  copperPourMode?: \"preserve\" | \"recompute\"\n  footprintConversionContext: FootprintConversionContext\n  pcbComponentRuntimeNameByPcbComponentId: PcbComponentRuntimeNameByPcbComponentId\n  standaloneCadModelRuntimeNameByCadComponentId: StandaloneCadModelRuntimeNameByCadComponentId\n  pcbBoard: PcbBoard\n  boardProps: string[]\n  boardChildren: string[]\n}\n\nexport type BoardConverterStage = (context: BoardConverterContext) => void\n","lib/board-converter/stages/convert-copper-pours.ts":"import { generateCopperPoursTsx } from \"../../generate-copper-pours-tsx\"\nimport type { BoardConverterStage } from \"../BoardConverterContext\"\n\nexport const convertCopperPours: BoardConverterStage = ({\n  boardChildren,\n  circuitJson,\n  footprintConversionContext,\n  copperPourMode,\n}) => {\n  boardChildren.push(\n    ...generateCopperPoursTsx(circuitJson, { ...footprintConversionContext, copperPourMode }),\n  )\n}\n","lib/generate-copper-pours-tsx.ts":"import { getCopperPourRecomputeAttributes } from \"./get-copper-pour-recompute-attributes\"\nimport { su } from \"@tscircuit/soup-util\"\nimport type { AnyCircuitElement } from \"circuit-json\"\nimport { getCopperPourOutline } from \"./get-copper-pour-outline\"\nimport type { BoardConversionContext } from \"./board-conversion-context\"\n\nexport function generateCopperPoursTsx(\n  circuitJson: AnyCircuitElement[],\n  context?: BoardConversionContext & { copperPourMode?: \"preserve\" | \"recompute\" },\n): string[] {\n  const clearanceAttributes = context?.copperPourMode === \"recompute\" &&\n    circuitJson.some((element) => element.type === \"pcb_copper_pour\")\n      ? getCopperPourRecomputeAttributes(circuitJson)\n      : \"padMargin={0} traceMargin={0} clearance={0} boardEdgeMargin={0} cutoutMargin={0}\"\n  const sourceNetNameById = new Map(\n    su(circuitJson)\n      .source_net.list()\n      .map((sourceNet) => [sourceNet.source_net_id, sourceNet.name]),\n  )\n  const reservedNetNames = new Set(sourceNetNameById.values())\n  const usedNetNames = new Set<string>()\n  const copperPours = su(circuitJson)\n    .pcb_copper_pour.list()\n    .flatMap((pour) => {\n      const resolvedSourceNetName = pour.source_net_id\n        ? (context?.runtimeNetNameBySourceNetId.get(pour.source_net_id) ??\n          sourceNetNameById.get(pour.source_net_id))\n        : undefined\n      const sourceNetName =\n        resolvedSourceNetName ??\n        getUnassignedCopperPourNetName({\n          pcbCopperPourId: pour.pcb_copper_pour_id,\n          reservedNetNames,\n        })\n\n      const outline = getCopperPourOutline(pour)\n      if (!outline || outline.length < 3) return []\n      usedNetNames.add(sourceNetName)\n      const netSelector = `net[name=${JSON.stringify(sourceNetName)}]`\n\n      return [\n        `<copperpour layer={${JSON.stringify(pour.layer)}} connectsTo={${JSON.stringify(netSelector)}} outline={${JSON.stringify(outline)}} ${clearanceAttributes} useThermalReliefs={false} coveredWithSolderMask={${pour.covered_with_solder_mask ?? true}} />`,\n      ]\n    })\n  const contextNetNames = new Set(\n    context?.runtimeNetNameBySourceNetId.values() ?? [],\n  )\n  const nets = [...usedNetNames]\n    .filter((sourceNetName) => !contextNetNames.has(sourceNetName))\n    .map((sourceNetName) => `<net name={${JSON.stringify(sourceNetName)}} />`)\n\n  return [...nets, ...copperPours]\n}\n\nconst getUnassignedCopperPourNetName = ({\n  pcbCopperPourId,\n  reservedNetNames,\n}: {\n  pcbCopperPourId: string\n  reservedNetNames: Set<string>\n}): string => {\n  const baseName = `__circuit_json_unassigned_${pcbCopperPourId}`\n  let name = baseName\n  let suffix = 2\n\n  while (reservedNetNames.has(name)) {\n    name = `${baseName}_${suffix}`\n    suffix += 1\n  }\n\n  reservedNetNames.add(name)\n  return name\n}\n","lib/get-copper-pour-recompute-attributes.ts":"import type { AnyCircuitElement } from \"circuit-json\"\n\nexport function getCopperPourRecomputeAttributes(\n  circuitJson: AnyCircuitElement[],\n): string {\n  const board = circuitJson.find((element) => element.type === \"pcb_board\")\n  const padMargin = requireClearance({\n    clearance: board?.min_trace_to_pad_edge_clearance,\n    field: \"min_trace_to_pad_edge_clearance\",\n  })\n  const traceMargin = requireClearance({\n    clearance: board?.min_different_net_trace_edge_to_trace_edge_clearance,\n    field: \"min_different_net_trace_edge_to_trace_edge_clearance\",\n  })\n  const clearance = requireClearance({\n    clearance: board?.min_pad_edge_to_pad_edge_clearance,\n    field: \"min_pad_edge_to_pad_edge_clearance\",\n  })\n  const boardEdgeMargin = requireClearance({\n    clearance: board?.min_board_edge_clearance ?? clearance,\n    field: \"min_board_edge_clearance\",\n  })\n  return `padMargin={${padMargin}} traceMargin={${traceMargin}} clearance={${clearance}} boardEdgeMargin={${boardEdgeMargin}} cutoutMargin={${clearance}}`\n}\n\nfunction requireClearance({\n  clearance,\n  field,\n}: {\n  clearance: number | undefined\n  field: string\n}): number {\n  if (clearance === undefined || !Number.isFinite(clearance) || clearance < 0) {\n    throw new Error(`Copper pour recomputation requires a finite, nonnegative pcb_board.${field}`)\n  }\n  return clearance\n}\n","tests/test30-recompute-copper-pours.test.tsx":"import { expect, test } from \"bun:test\"\nimport { convertCircuitJsonToPcbSvg } from \"circuit-to-svg\"\nimport { convertCircuitJsonToTscircuit } from \"lib\"\nimport { stackSvgsHorizontally } from \"stack-svgs\"\nimport { runTscircuitCode } from \"tscircuit\"\nimport { createCopperPourClearanceCircuit, hasCopperPourAt } from \"./fixtures/copper-pour-clearance\"\n\ntest(\"recomputes copper using board clearances around new routing\", async () => {\n  const input = await createCopperPourClearanceCircuit()\n  const preservedTsx = convertCircuitJsonToTscircuit(input, { componentName: \"ClearanceBoard\" })\n  expect(convertCircuitJsonToTscircuit(input, { componentName: \"ClearanceBoard\", copperPourMode: \"preserve\" })).toBe(preservedTsx)\n  const tsx = convertCircuitJsonToTscircuit(input, { componentName: \"ClearanceBoard\", copperPourMode: \"recompute\" })\n  expect(tsx).toContain(\"padMargin={0.3} traceMargin={0.3} clearance={0.3} boardEdgeMargin={0.4} cutoutMargin={0.3}\")\n  const preserved = await runTscircuitCode(preservedTsx)\n  const recomputed = await runTscircuitCode(tsx)\n  expect(recomputed.some((element) => element.type === \"pcb_trace\")).toBe(true)\n  expect(hasCopperPourAt(preserved, { x: 0, y: 0.2 })).toBe(true)\n  expect(hasCopperPourAt(recomputed, { x: 0, y: 0.2 })).toBe(false)\n  expect(hasCopperPourAt(recomputed, { x: 0, y: 1 })).toBe(true)\n  const ground = recomputed.find((element) => element.type === \"source_net\" && element.name === \"GND\")\n  if (ground?.type !== \"source_net\") throw new Error(\"Expected rendered GND net\")\n  expect(recomputed.filter((element) => element.type === \"pcb_copper_pour\").every((pour) => pour.source_net_id === ground.source_net_id)).toBe(true)\n  const missingClearance = input.map((element) => element.type === \"pcb_board\" ? { ...element, min_different_net_trace_edge_to_trace_edge_clearance: undefined } : element)\n  expect(() => convertCircuitJsonToTscircuit(missingClearance, { copperPourMode: \"recompute\" })).toThrow(\"min_different_net_trace_edge_to_trace_edge_clearance\")\n  const invalidClearance = input.map((element) => element.type === \"pcb_board\" ? { ...element, min_board_edge_clearance: -0.1 } : element)\n  expect(() => convertCircuitJsonToTscircuit(invalidClearance, { copperPourMode: \"recompute\" })).toThrow(\"min_board_edge_clearance\")\n  const comparison = stackSvgsHorizontally(\n    [preserved, recomputed].map((circuitJson) => convertCircuitJsonToPcbSvg(circuitJson, {\n      width: 600, height: 400, backgroundColor: \"white\",\n      includeVersion: false, showSolderMask: false, shouldDrawRatsNest: false,\n    })),\n    { gap: 24, normalizeSize: false, rootAttributes: { \"aria-label\": \"Zero-clearance import on left; freshly computed copper with 0.3 mm routing clearance on right\" } },\n  )\n  await expect(comparison).toMatchSvgSnapshot(import.meta.path)\n}, 30000)\n"};for(const [name,content]of Object.entries(files)){fs.mkdirSync(path.dirname(name),{recursive:true});fs.writeFileSync(name,content)}
          NODE
      - name: Match repository formatting
        run: bunx biome format --write tests/fixtures/copper-pour-clearance.ts tests/test29-copper-pour-clearance-repro.test.tsx lib/index.ts lib/get-board-using-template.ts lib/board-converter/convert-board-circuit-json.ts lib/board-converter/BoardConverterContext.ts lib/board-converter/stages/convert-copper-pours.ts lib/generate-copper-pours-tsx.ts lib/get-copper-pour-recompute-attributes.ts tests/test30-recompute-copper-pours.test.tsx
      - name: Generate repro and fix snapshots through core
        run: BUN_UPDATE_SNAPSHOTS=1 bun test tests/test29-copper-pour-clearance-repro.test.tsx tests/test30-recompute-copper-pours.test.tsx --timeout 9999999
      - name: Verify existing pour, trace and board conversions
        run: bun test tests/test25-support-copper-pours.test.tsx tests/test27-support-netless-copper-pours.test.tsx tests/test28-support-curved-copper-pours.test.tsx tests/test24-support-pcb-traces.test.tsx tests/test19-support-board-conversion.test.tsx tests/test20-board-conversion-drops-children.test.tsx tests/board-autorouted-pad-connectivity.test.tsx tests/board-center.test.tsx tests/board-component-name.test.tsx --timeout 9999999
      - run: bunx tsc --noEmit
      - run: bun run build
      - name: Return source and generated SVGs
        if: always()
        run: |
          node <<'NODE'
          const fs=require('node:fs');const {Resvg}=require('@resvg/resvg-js');const names=["tests/fixtures/copper-pour-clearance.ts","tests/test29-copper-pour-clearance-repro.test.tsx","tests/__snapshots__/test29-copper-pour-clearance-repro.snap.svg","lib/index.ts","lib/get-board-using-template.ts","lib/board-converter/convert-board-circuit-json.ts","lib/board-converter/BoardConverterContext.ts","lib/board-converter/stages/convert-copper-pours.ts","lib/generate-copper-pours-tsx.ts","lib/get-copper-pour-recompute-attributes.ts","tests/test30-recompute-copper-pours.test.tsx","tests/__snapshots__/test30-recompute-copper-pours.snap.svg"];for(const name of names){if(fs.existsSync(name)){console.log('POUR_ARTIFACT '+name+' '+fs.readFileSync(name).toString('base64'));if(name.endsWith('.svg'))console.log('POUR_PREVIEW '+name+' '+new Resvg(fs.readFileSync(name,'utf8'),{fitTo:{mode:'width',value:1600}}).render().asPng().toString('base64'))}}
          NODE
