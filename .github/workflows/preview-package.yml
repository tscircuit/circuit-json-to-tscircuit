name: Preview package

on:
  push:
    branches: [preview/supported-jscad-component-api]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx pkg-pr-new publish --compact --comment=off
