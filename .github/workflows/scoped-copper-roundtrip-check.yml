name: Verify scoped copper TSX round trip
on:
  push:
    branches: [codex/scoped-copper-roundtrip-check]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install
      - run: BUN_UPDATE_SNAPSHOTS=1 bun test tests/test31-scoped-copper-clearance.test.tsx
      - run: bun test tests/test30-recompute-copper-pours.test.tsx
      - name: Report synthetic round-trip SVG
        run: |
          node <<'NODE'
          const fs=require("node:fs"),z=require("node:zlib");
          const directory="tests/__snapshots__";
          for(const file of fs.readdirSync(directory).filter(file=>file.startsWith("test31-scoped-copper-clearance")&&file.endsWith(".svg")))console.log("SCOPED_TSX_SVG "+JSON.stringify({path:directory+"/"+file,gzip:z.gzipSync(fs.readFileSync(directory+"/"+file)).toString("base64")}));
          NODE
